 { id:"arte", nav:"Arte", titulo:"Arte y patrimonio",

 { id:"cultura", nav:"Cultura", titulo:"Cultura",
   texto:[
    "Manabí posee una identidad cultural construida a partir de la relación entre sus comunidades, el territorio costero y las actividades agrícolas, pesqueras y artesanales. Entre sus principales expresiones culturales está el pueblo montubio, cuya presencia es especialmente importante en Manabí y otras provincias de la Costa ecuatoriana. La identidad montubia se relaciona con la vida rural, el trabajo agrícola y ganadero, el uso tradicional del sombrero y el machete, además de expresiones orales como los amorfinos (INPC, 2015).",

 { id:"musica", nav:"Música", titulo:"Música",
   texto:[
    "<strong>Ritmos.</strong> La música de Manabí está ligada a la cultura montubia y a su tradición oral. Su género más representativo es el amorfino, cuya composición se basa en versos de ocho sílabas. Junto a él se mencionan otros ritmos montubios, como el galope, la guaracha montubia y el caminante (Macías Ferrin, 2020).",
    "<strong>Instrumentos.</strong> Uno de los más característicos es la caja tambora, un instrumento de percusión elaborado con maderas del campo manabita e incrustaciones de bambú. Tiene forma octagonal, porque este diseño favorece la riqueza del sonido, y un orificio en la parte superior por donde sale el aire. Produce sonidos agudos en su lado izquierdo y graves-medios en el derecho. Su función es llevar la célula rítmica que los montubios usan para el amorfino (Macías Ferrin, 2020).",
    "<strong>Artistas.</strong> Entre quienes han aportado a esta música está Luis Andrés Macías Ferrin, de la Universidad Laica Eloy Alfaro de Manabí, quien estudia la caja tambora y su papel en la música montubia. También se reconoce el trabajo del folclorólogo Manuel de Jesús Álvarez, uno de los pocos autores que investigó la historia del amorfino. La caja tambora surgió de la necesidad de crear nuevas memorias culturales a partir de la música de tradición oral montubia, lo que muestra que esta herencia sigue viva y se renueva (Macías Ferrin, 2020)."],
   items:[{t:"Ritmo principal",d:"Amorfino"},{t:"Otros ritmos",d:"Galope, guaracha montubia y caminante"},{t:"Instrumento",d:"Caja tambora"}],

 { id:"juegos", nav:"Juegos", titulo:"Juegos tradicionales",
   texto:[
    "<strong>Origen.</strong> Los juegos tradicionales se transmiten de generación en generación y reflejan la vida de las comunidades. No tienen un único autor ni una fecha de origen: se aprendieron jugando y se heredaron de padres a hijos. En Manabí se mantienen torneos y fiestas. Por ejemplo, en 2013 Jaramijó recibió los III Juegos Autóctonos, Ancestrales, Populares y Tradicionales del Pueblo Cholo del Ecuador, con participantes de Santa Elena, Los Ríos, El Oro, Guayas y Manabí (Ministerio del Deporte, 2013).",

   items:[{t:"Trompo",d:"Se lanza con un cordel; gana quien lo mantiene girando más tiempo."},{t:"Palo encebado",d:"Se trepa un poste untado con grasa hasta llegar a la punta."},{t:"Ensacados",d:"Se corre saltando dentro de un saco; quien se cae o sale queda eliminado."}],

 { id:"leyendas", nav:"Leyendas", titulo:"Cuentos y leyendas",

    "<strong>Mensaje.</strong> Las leyendas y los cuentos nos invitan a valorar nuestras raíces, respetar las tradiciones y transmitir las historias a las nuevas generaciones. Recopilar y compartir estas narraciones ayuda a mantener viva la memoria cultural de los pueblos.",
    "<strong>Ejemplo: La Poza del Encanto.</strong> Esta narración forma parte de las recopilaciones de leyendas manabitas. Su nombre evoca un lugar rodeado de misterio, relacionado con las creencias y la imaginación popular. Como interpretación cultural, la leyenda permite reflexionar sobre cómo ciertos espacios naturales adquieren un significado especial mediante las historias transmitidas por sus habitantes. Este ejemplo muestra la relación entre el entorno, las creencias y la tradición oral de Manabí (Zambrano, 2005)."],
   items:[],
   img:"leyenda-pozo.jpg", pie:"Ilustración de la leyenda “El pozo encantado”. Fuente: Leyendas e historias de Manabí y del Ecuador.",

 { id:"fiestas", nav:"Fiestas", titulo:"Fiestas y patrimonio",

   items:[
    {t:"Fiestas tradicionales",img:"Fiestas_tradicionales.jpg",d:"Reúnen a las comunidades alrededor de celebraciones religiosas, música, bailes, gastronomía y actividades populares. Un ejemplo importante es la fiesta de San Pedro y San Pablo, también conocida como Fiesta de Blancos y Negros, celebrada en Manabí. Combina la devoción religiosa con expresiones festivas y representaciones simbólicas, y fortalece la participación y la identidad comunitaria (Instituto Nacional de Patrimonio Cultural [INPC], s. f.)."},
    {t:"Patrimonio material",img:"Patrimonio_material.jpeg",d:"Está formado por bienes físicos que poseen valor histórico, arqueológico o cultural, como edificios, monumentos y objetos antiguos. En Manabí destaca el complejo arqueológico Cerros Hojas-Jaboncillo, relacionado con la cultura manteña. Sus vestigios, terrazas, estructuras y sillas de piedra permiten conocer aspectos de la organización y las actividades de esta sociedad prehispánica (INPC, s. f.)."},

 { id:"desarrollo", nav:"Desarrollo", titulo:"Desarrollo local",

/* ===================== NO NECESITAS TOCAR DESDE AQUÍ ===================== */
const ph = (src, etiqueta) =>
  `<div class="ph"><span>${etiqueta}<br>(img/${src})</span><img src="img/${encodeURI(src)}" alt="${etiqueta}" onerror="this.remove()"></div>`;

document.getElementById("menu").innerHTML =
  `<div class="nav-in"><a class="brand" href="#inicio"><i>M</i>Manabí</a>
   <button class="burger" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button>
   <div class="links"><a href="#inicio" data-id="inicio">Inicio</a>` +
  SECCIONES.map(s => `<a ${s.href ? 'class="ref" ' : ""}href="${s.href || "#" + s.id}" data-id="${s.id}">${s.nav}</a>`).join("") + `</div></div>`;

document.getElementById("contenido").innerHTML = SECCIONES.map(s => {
  const parrafos = s.texto.map(p => `<p>${p}</p>`).join("");
  const items = s.items.length
    ? `<div class="items" style="grid-template-columns:repeat(auto-fit,minmax(min(${s.minItem || 230}px,100%),1fr))">${s.items.map(i => `<div class="item${i.img ? " con-img" : ""}"><h3>${i.t}</h3><p>${i.d}</p>${i.img ? `<figure class="card-img">${ph(i.img, i.t)}</figure>` : ""}</div>`).join("")}</div>` : "";
  const banner = s.banner ? `<figure class="banner">${ph(s.banner, s.titulo)}${s.bannerPie ? `<figcaption>${s.bannerPie}</figcaption>` : ""}</figure>` : "";
  let cuerpo;
  if (s.especial === "referencias") cuerpo = `<div class="txt">${parrafos}</div><a class="btn-ref" href="${s.href}">Ver referencias</a>`;
  else if (s.especial === "innovacion") {
    const f = s.infografia, v = s.video, q = s.qr;
    cuerpo = `<div class="txt">${parrafos}</div>
    <div class="innov">
      <article class="card c-info">
        <span class="tag">Innovación 1 · Infografía</span>
        <h3>${f.titulo}</h3>
        <div class="card-body">${ph(f.img, "Infografía")}</div>
        <p>${f.desc}</p>
        <a class="btn-ref" href="${f.enlace}" target="_blank" rel="noopener">Ver en Canva</a>
      </article>
      <article class="card c-vid">
        <span class="tag">Innovación 2 · Video</span>
        <h3>${v.titulo}</h3>
        <div class="card-body"><iframe src="https://drive.google.com/file/d/${v.id}/preview" title="${v.titulo}" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>
        <p>${v.desc}</p>
        <a class="btn-ref" href="https://drive.google.com/file/d/${v.id}/view" target="_blank" rel="noopener">Abrir video en Drive</a>
      </article>
    </div>
    <div class="qrbox"><div class="qr"><span>QR<br>(img/${q.img})</span><img src="img/${q.img}" alt="${q.titulo}" onerror="this.remove()"></div>
      <div><span class="tag">Innovación 3 · Código QR</span><h3>${q.titulo}</h3><p>${q.desc}</p></div></div>`;
  }
  else if (!s.img) cuerpo = `<div class="txt">${parrafos}<p class="fuentes">Fuentes: ${s.fuentes}</p></div>${items}${banner}`;
  else cuerpo = `<div class="cols"><div class="txt">${parrafos}<p class="fuentes">Fuentes: ${s.fuentes}</p></div>
    <figure style="margin:0">${ph(s.img, s.titulo)}${s.pie ? `<figcaption>${s.pie}</figcaption>` : ""}</figure></div>${items}${banner}`;
  return `<section id="${s.id}"><div class="in"><h2>${s.titulo}</h2>${cuerpo}</div></section>`;
}).join("");

document.getElementById("pie-titulo").textContent = SITIO.piTitulo;
document.getElementById("pie-texto").innerHTML =
  SITIO.piTexto + ` Enlace: <a href="${SITIO.enlace}" target="_blank" rel="noopener">${SITIO.enlace}</a>`;

/* Menú: abrir/cerrar en celular y resaltar la sección visible */
(function(){
  const nav = document.getElementById("menu"), btn = nav.querySelector(".burger");
  btn.addEventListener("click", () => { const o = nav.classList.toggle("abierto"); btn.setAttribute("aria-expanded", o); });
  nav.querySelectorAll(".links a").forEach(a => a.addEventListener("click", () => { nav.classList.remove("abierto"); btn.setAttribute("aria-expanded", "false"); }));
  const enlaces = {}; nav.querySelectorAll(".links a[data-id]").forEach(a => enlaces[a.dataset.id] = a);
  const marcar = id => { Object.values(enlaces).forEach(a => a.classList.remove("activo")); if (enlaces[id]) enlaces[id].classList.add("activo"); };
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) marcar(e.target.id); }), { rootMargin: "-40% 0px -55% 0px" });
    document.querySelectorAll("header#inicio, main section").forEach(el => io.observe(el));
  }
})();
</script>
