const SECCIONES = [
 { id:"provincia", nav:"Provincia", titulo:"Presentación de la provincia",
   texto:[
    "<strong>Ubicación.</strong> Manabí está localizada en el centro-noroeste del Ecuador continental y pertenece a la región geográfica del Litoral (Gobernación de Manabí, s. f.-a). Su capital es Portoviejo, y la provincia se divide en 22 cantones (Consorcio de Gobiernos Autónomos Provinciales del Ecuador [CONGOPE], s. f.).",

 { id:"arte", nav:"Arte y patrimonio", titulo:"Arte y patrimonio", autor:"Valeska Arguello",
   texto:[
    "<strong>Arte.</strong> Manabí conserva un legado artístico ancestral. El Museo y Centro Cultural Manta muestra elementos de las culturas Valdivia, Machalilla, Chorrera, Jama Coaque, Bahía, Guangala y Manteño, entre ellos las sillas en forma de “U” (Ministerio de Cultura y Patrimonio, 2022). La cultura Jama Coaque destacó por su cerámica hecha por artesanos especializados, con figurillas de músicos, danzantes y agricultores (Ministerio de Cultura y Patrimonio, s. f.).",

 { id:"cultura", nav:"Cultura", titulo:"Cultura", autor:"Gabriela Chuchuca",

    "Manabí posee una identidad cultural construida a partir de la relación entre sus comunidades, el territorio costero y las actividades agrícolas, pesqueras y artesanales. Entre sus principales expresiones culturales está el pueblo montubio, cuya presencia es especialmente importante en Manabí y otras provincias de la Costa ecuatoriana. La identidad montubia se relaciona con la vida rural, el trabajo agrícola y ganadero, el uso tradicional del sombrero y el machete, además de expresiones orales como los amorfinos (INPC, 2015).",
    "<strong>Pueblos y nacionalidades.</strong> En la provincia también existen comunidades vinculadas con la cultura cholo pescadora, específicamente en zonas costeras. Su identidad se relaciona con la pesca artesanal, la navegación y el aprovechamiento de los recursos del mar. Estas prácticas se han transmitido entre generaciones y forman parte de la memoria cultural de las comunidades costeras (Gobierno Provincial de Manabí, 2023).",
    "<strong>Lenguas.</strong> En la actualidad el castellano es la lengua de uso predominante en las comunidades manabitas. Por ejemplo, el registro de patrimonio cultural inmaterial de la provincia identifica al grupo montubio y al castellano como elementos relacionados con determinadas manifestaciones de tradición oral (Torres Pihuave, 2024).",
    "<strong>Tradiciones.</strong> Entre las más representativas están los amorfinos, las fiestas comunitarias, las prácticas agrícolas y pesqueras, la elaboración artesanal y diferentes costumbres gastronómicas. En las comunidades de Jipijapa, por ejemplo, se han registrado fiestas patronales, juegos tradicionales, medicina tradicional mediante plantas y el uso del horno de leña como parte de las prácticas culturales locales (Suárez Baque, 2023)."],

    {t:"Ceviche de Jipijapa",d:"<em>Ingredientes:</em> marisco o pescado con salsa de maní. <em>Historia:</em> es uno de los platos emblemáticos de la provincia y se prepara con un toque propio de Jipijapa (Manabí es designada, 2024)."},
    {t:"Caldo de gallina criolla",d:"<em>Ingredientes:</em> gallina criolla, verduras, yuca, plátano y condimentos. <em>Historia:</em> preparación tradicional de las zonas rurales y parte de la cocina familiar manabita. La gallina criolla se incorporó a la alimentación de la región y hoy se usa en caldos y otros platos (Alvarado et al., 2021)."}],
   img:"gastronomia.jpg", pie:"[Descripción]. Fuente: [fuente].",
   fuentes:"Duarte-Casar y Parreño-García (2025); Mes del Manabitismo (2025); Alvarado et al. (2021)." },

 { id:"musica", nav:"Música", titulo:"Música", autor:"Rosa Núñez",
   texto:[
    "<strong>Ritmos.</strong> La música de Manabí está ligada a la cultura montubia y a su tradición oral. Su género más representativo es el amorfino, cuya composición se basa en versos de ocho sílabas. Junto a él se mencionan otros ritmos montubios, como el galope, la guaracha montubia y el caminante (Macías Ferrin, 2020).",
    "<strong>Instrumentos.</strong> Uno de los más característicos es la caja tambora, un instrumento de percusión elaborado con maderas del campo manabita e incrustaciones de bambú. Tiene forma octagonal, porque este diseño favorece la riqueza del sonido, y un orificio en la parte superior por donde sale el aire. Produce sonidos agudos en su lado izquierdo y graves-medios en el derecho. Su función es llevar la célula rítmica que los montubios usan para el amorfino (Macías Ferrin, 2020).",
    "<strong>Artistas.</strong> Entre quienes han aportado a esta música está Luis Andrés Macías Ferrin, de la Universidad Laica Eloy Alfaro de Manabí, quien estudia la caja tambora y su papel en la música montubia. También se reconoce el trabajo del folclorólogo Manuel de Jesús Álvarez, uno de los pocos autores que investigó la historia del amorfino. La caja tambora surgió de la necesidad de crear nuevas memorias culturales a partir de la música de tradición oral montubia, lo que muestra que esta herencia sigue viva y se renueva (Macías Ferrin, 2020)."],
   items:[{t:"Ritmo principal",d:"Amorfino"},{t:"Otros ritmos",d:"Galope, guaracha montubia y caminante"},{t:"Instrumento",d:"Caja tambora"}],

/* ===================== NO NECESITAS TOCAR DESDE AQUÍ ===================== */
const ph = (src, etiqueta) =>
  `<div class="ph"><span>${etiqueta}<br>(img/${src})</span><img src="img/${src}" alt="${etiqueta}" onerror="this.remove()"></div>`;

document.getElementById("menu").innerHTML =
  `<a href="#inicio">Inicio</a>` + SECCIONES.map(s => `<a href="#${s.id}">${s.nav}</a>`).join("");

document.getElementById("contenido").innerHTML = SECCIONES.map(s => {
  const parrafos = s.texto.map(p => `<p>${p}</p>`).join("");
  const items = s.items.length
    ? `<div class="items">${s.items.map(i => `<div class="item"><h3>${i.t}</h3><p>${i.d}</p></div>`).join("")}</div>` : "";
  let cuerpo;
  if (s.especial === "referencias") cuerpo = `<ol class="refs" style="padding:0">${REFERENCIAS.map(r => `<li>${r}</li>`).join("")}</ol>`;
  else cuerpo = `<div class="cols"><div class="txt">${parrafos}<p class="fuentes">Fuentes: ${s.fuentes}</p></div>
    <figure style="margin:0">${ph(s.img, s.titulo)}<figcaption>${s.pie}</figcaption></figure></div>${items}`;
  return `<section id="${s.id}"><div class="in"><h2>${s.titulo}</h2><p class="autor">${s.autor}</p>${cuerpo}</div></section>`;
}).join("");

document.getElementById("pie-titulo").textContent = SITIO.piTitulo;
document.getElementById("pie-texto").textContent = SITIO.piTexto;
