 { id:"cultura", nav:"Cultura", titulo:"Cultura", autor:"Gabriela Chuchuca",

    "<strong>Ritmos.</strong> La música de Manabí está ligada a la cultura montubia y a su tradición oral. Su género más representativo es el amorfino, cuya composición se basa en versos de ocho sílabas. Junto a él se mencionan otros ritmos montubios, como el galope, la guaracha montubia y el caminante (Macías Ferrin, 2020).",

    "<strong>Economía.</strong> La cultura manabita puede generar oportunidades para productores, artesanos, emprendedores y trabajadores vinculados con la gastronomía y el turismo. Las artesanías, la elaboración del sombrero de paja toquilla, la cerámica, la cestería y otros productos tradicionales forman parte de las actividades culturales de la provincia (Gobierno Provincial de Manabí, 2025). Además, la gastronomía tradicional relaciona los conocimientos culinarios con la producción agrícola y pesquera, lo que beneficia a agricultores, pescadores, cocineros, artesanos y emprendedores locales (Gobierno Provincial de Manabí, 2026).",

    "<strong>Territorio.</strong> Las tradiciones y actividades culturales se desarrollan en espacios rurales y urbanos y se vinculan con la agricultura, la pesca, la gastronomía y las formas de vida de las comunidades. La planificación territorial de Manabí reconoce la importancia de fortalecer la identidad y poner en valor sus recursos patrimoniales y culturales (Gobierno Provincial de Manabí, 2021).",

  `Ministerio del Deporte. (2013, 13 de septiembre). <em>Ya se viven los Juegos Cholos en Manabí</em>. ${A("https://educacion.gob.ec/deporte/ya-se-viven-los-juegos-cholos-en-manabi/")}`,
  `Ministerio de Turismo. (2017). <em>Declaratoria del sombrero de paja toquilla como Patrimonio Inmaterial de la Humanidad se recordará en Manabí</em>. ${A("https://www.turismo.gob.ec/declaratoria-del-sombrero-de-paja-toquilla-como-patrimonio-inmaterial-de-la-humanidad-se-recordara-en-manabi/")}`,
  `Suárez Baque, T. L. (2023). <em>Las costumbres y tradiciones y su importancia en los habitantes de la parroquia La América, del cantón Jipijapa, provincia de Manabí</em> [Tesis de grado, Universidad Estatal del Sur de Manabí]. Repositorio Digital UNESUM. ${A("https://repositorio.unesum.edu.ec/handle/53000/5633")}`
];

/* ===================== NO NECESITAS TOCAR DESDE AQUÍ ===================== */
const ph = (src, etiqueta) =>
  `<div class="ph"><span>${etiqueta}<br>(img/${src})</span><img src="img/${src}" alt="${etiqueta}" onerror="this.remove()"></div>`;

const medios = () => {
  const v = SITIO.video
    ? `<iframe src="${SITIO.video}" title="Manabí, cultura viva" allowfullscreen loading="lazy"></iframe>`
    : SITIO.videoArchivo
      ? `<video controls style="width:100%;border-radius:6px" src="${SITIO.videoArchivo}"></video>`
      : `<div class="ph" style="aspect-ratio:16/9"><span>Video “Manabí, cultura viva”<br>(pega la URL en SITIO.video)</span></div>`;
  return `<div class="media"><figure style="margin:0">${ph("infografia.png","Infografía: Manabí en cifras y cultura")}<figcaption>Infografía “Manabí en cifras y cultura”.</figcaption></figure>
  <figure style="margin:0">${v}<figcaption>Video “Manabí, cultura viva”.</figcaption></figure></div>`;
};

document.getElementById("menu").innerHTML =
  `<a href="#inicio">Inicio</a>` + SECCIONES.map(s => `<a href="#${s.id}">${s.nav}</a>`).join("");

document.getElementById("contenido").innerHTML = SECCIONES.map(s => {
  const parrafos = s.texto.map(p => `<p>${p}</p>`).join("");
  const items = s.items.length
    ? `<div class="items">${s.items.map(i => `<div class="item"><h3>${i.t}</h3><p>${i.d}</p></div>`).join("")}</div>` : "";
  let cuerpo;
  if (s.especial === "innovacion") cuerpo = `<div class="txt">${parrafos}</div>${medios()}`;
  else if (s.especial === "referencias") cuerpo = `<ol class="refs" style="padding:0">${REFERENCIAS.map(r => `<li>${r}</li>`).join("")}</ol>`;
  else cuerpo = `<div class="cols"><div class="txt">${parrafos}<p class="fuentes">Fuentes: ${s.fuentes}</p></div>
    <figure style="margin:0">${ph(s.img, s.titulo)}<figcaption>${s.pie}</figcaption></figure></div>${items}`;
  return `<section id="${s.id}"><div class="in"><h2>${s.titulo}</h2><p class="autor">${s.autor}</p>${cuerpo}</div></section>`;
}).join("");

document.getElementById("pie-titulo").textContent = SITIO.piTitulo;
document.getElementById("pie-texto").textContent = SITIO.piTexto;
</script>
</body>
</html>
